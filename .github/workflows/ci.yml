name: CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install Dependencies
        run: npm ci || npm install
      - name: Build Shared Types
        run: npm run build --workspace=packages/shared
      # Không có tsconfig.json ở gốc -> typecheck từng project backend
      - name: Typecheck (shared, api, db tests)
        run: |
          npx tsc --noEmit -p packages/shared
          npx tsc --noEmit -p services/api
          npx tsc --noEmit -p db/tests

  database-constraints:
    name: PostgreSQL 16 Schema, Constraint & API Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthcare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/healthcare_test
      PGPASSWORD: postgrespassword

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install Dependencies
        run: npm ci || npm install
      - name: Build Shared Types
        run: npm run build --workspace=packages/shared
      # ON_ERROR_STOP: migration/seed lỗi là CI đỏ ngay, không in ERROR rồi chạy tiếp
      - name: Apply Migrations & Seeds
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d healthcare_test -f db/migrations/0001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d healthcare_test -f db/seeds/001_reference_and_demo.sql
      - name: Run Schema Constraint Test Suite (Tier 1)
        run: npm run test:db
      - name: Run API Unit & Integration Tests
        run: npm run test --workspace=services/api

  secret-scanning:
    name: Automated Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Không đặt base/head: action tự lấy khoảng commit từ sự kiện push/PR
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified
