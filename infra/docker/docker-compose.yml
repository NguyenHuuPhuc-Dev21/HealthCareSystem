version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    environment:
      POSTGRES_DB: healthcare_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../db/seeds/001_reference_and_demo.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d healthcare_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
