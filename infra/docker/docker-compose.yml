# Local infrastructure for development.
# The schema is NOT applied by the container any more: run `npm run db:migrate`
# after `npm run docker:up` (the runner tracks history in schema_migrations).
# If you created the volume with an older version of this file, reset it once:
#   npm run docker:down -- -v && npm run docker:up && npm run db:migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    environment:
      POSTGRES_DB: healthcare_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tothioanh15
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d healthcare_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible private object storage (CCCD, GPHN, prescriptions, selfies).
  # minio/minio and minio/mc were removed from Docker Hub in Sept 2026 (quay.io
  # now requires login). pgsty/silo is a MinIO build that ships both the server
  # and the `mc` client and runs as root. Pinned tag: never use :latest here.
  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    container_name: healthcare_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the private bucket (no anonymous access).
  minio-init:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    container_name: healthcare_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/healthcare-clinical-media-private &&
      mc anonymous set none local/healthcare-clinical-media-private
      "
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  minio_data:
