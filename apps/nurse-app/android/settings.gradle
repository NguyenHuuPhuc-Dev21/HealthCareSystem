rootProject.name = 'NurseApp'

def cliPlatformAndroidDir = new File(
    ["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json')"]
        .execute(null, rootDir).text.trim()
).getParentFile()

def rnGradlePluginDir = new File(
    ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"]
        .execute(null, rootDir).text.trim()
).getParentFile()

apply from: new File(cliPlatformAndroidDir, "native_modules.gradle"); applyNativeModulesSettingsGradle(settings)
include ':app'
includeBuild(rnGradlePluginDir)
