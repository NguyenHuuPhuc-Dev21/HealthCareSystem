apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def resolvedReactNativeDir = new File(
    ["node", "--print", "require.resolve('react-native/package.json')"]
        .execute(null, rootDir).text.trim()
).getParentFile()

def resolvedCodegenDir = new File(
    ["node", "--print", "require.resolve('@react-native/codegen/package.json')"]
        .execute(null, rootDir).text.trim()
).getParentFile()

def resolvedCliPlatformAndroidDir = new File(
    ["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json')"]
        .execute(null, rootDir).text.trim()
).getParentFile()

def resolvedRnConfigDir = new File(
    ["node", "--print", "require.resolve('react-native-config/package.json')"]
        .execute(null, rootDir).text.trim()
).getParentFile()

project.ext.envConfigFiles = [
    debug: ".env.development",
    release: ".env.production",
]

apply from: new File(resolvedRnConfigDir, "android/dotenv.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    reactNativeDir = resolvedReactNativeDir
    codegenDir = resolvedCodegenDir
    cliFile = new File(resolvedReactNativeDir, "cli.js")
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * Set this to true to build separate APKs per CPU architecture to keep size < 50 MB.
 */
def enableSeparateBuildPerCPUArchitecture = true

def jscFlavor = 'org.webkit:android-jsc:+'

def isBuildingBundle = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nurseapp"
    defaultConfig {
        applicationId "com.nurseapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        resValue "string", "build_config_package", "com.nurseapp"
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture && !isBuildingBundle
            universalApk false
            include "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: new File(resolvedCliPlatformAndroidDir, "native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
